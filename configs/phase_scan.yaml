phase_scan:
  scan_id: refcba_full_grid_v3
  state_config: configs/refcba_state_model.yaml
  md_config: configs/refcba_md.yaml
  output_root: results/refcba_full_grid_v3

  # 7 x 8 x 8 = 448 homogeneous-NVT screening states.
  pH_values: [3.0, 4.0, 4.5, 4.8852, 5.5, 7.0, 9.0]
  nacl_mM_values: [0.0, 25.0, 50.0, 100.0, 200.0, 300.0, 400.0, 500.0]
  concentration_mg_ml_values: [0.1, 0.2, 0.5, 1.0, 2.0, 5.0, 10.0, 20.0]
  seeds: [20260813]

  coarse:
    equil_steps: 50000
    prod_steps: 500000
    report_interval_steps: 1000

  refinement:
    duration_ns: 30.0
    seeds: [20260814, 20260815, 20260816]

  classification:
    direct_profile_min_contrast: 0.50
    direct_profile_min_axial_cv: 0.75
    slab_min_contact_turnover: 0.02
    slab_min_core_msd_nm2: 0.05
    homogeneous_coarsening_min_slope_per_ns: 0.02
